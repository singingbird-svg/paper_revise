[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-digest"
version = "0.1.0"
description = "Collect and summarize daily papers from multiple public sources."
requires-python = ">=3.9"

[project.scripts]
paper-digest = "paper_digest.cli:main"

[tool.setuptools.packages.find]
include = ["paper_digest*"]
